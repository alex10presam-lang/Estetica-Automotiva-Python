<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Lavagem | DJ WASH</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/cadastro.css">
<link rel="stylesheet" href="/static/css/studio.css">
</head>
<body>
<div class="portfolio-notice">DJ WASH / PORTFÓLIO <span>Demonstração local · use dados fictícios</span></div>

<nav class="navbar navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="/">DJ <span style="color: var(--dj-gold);">WASH</span></a>
        <a href="/" class="btn-voltar">
            <i class="fas fa-arrow-left me-2"></i>Voltar
        </a>
    </div>
</nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-9 col-xl-8">
            <div class="card-cadastro">
                <div class="page-title">
                    <h3>
                        <i class="fas fa-car-wash"></i>
                        Nova <span style="color: var(--dj-gold);">Lavagem</span>
                    </h3>
                </div>

                <form action="/lavagens/registrar" method="POST">

                    <div class="toggle-container">
                        <label class="toggle-label">
                            <i class="fas fa-user-check me-2"></i>
                            O cliente já é cadastrado?
                        </label>
                        <div class="btn-group w-100" role="group">
                            <input type="radio" class="btn-check" name="modo_cliente" id="modo_existente" value="existente" checked onclick="alternarCampos()">
                            <label class="btn btn-toggle-option" for="modo_existente">
                                <i class="fas fa-check-circle me-2"></i>SIM, já cadastrado
                            </label>

                            <input type="radio" class="btn-check" name="modo_cliente" id="modo_novo" value="novo" onclick="alternarCampos()">
                            <label class="btn btn-toggle-option" for="modo_novo">
                                <i class="fas fa-user-plus me-2"></i>NÃO, novo cliente
                            </label>
                        </div>
                    </div>

                    <div id="secao_existente">
                        <div class="section-title">
                            <i class="fas fa-car"></i>
                            Selecionar Veículo
                        </div>

                        <div class="select-vehicle-card">
                            <label class="form-label">Busque pelo modelo ou placa</label>
                            <select name="veiculo_id" class="form-select">
                                <option value="" disabled selected>Escolha o veículo cadastrado...</option>
                                {% for v in veiculos %}
                                    <option value="{{ v.id }}">
                                        {{ v.modelo }} | {{ v.placa }} • {{ v.cliente.nome }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div id="secao_novo" style="display: none;">
                        <div class="section-title">
                            <i class="fas fa-user"></i>
                            Dados do Novo Cliente
                        </div>

                        <div class="input-group-custom">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label">
                                        <i class="fas fa-user me-2"></i>Nome Completo
                                    </label>
                                    <input type="text" name="nome" class="form-control" placeholder="Ex: João Silva">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">
                                        <i class="fab fa-whatsapp me-2"></i>WhatsApp
                                    </label>
                                    <input type="text" name="telefone" class="form-control" placeholder="(11) 99999-9999">
                                </div>
                            </div>
                        </div>

                        <div class="section-title">
                            <i class="fas fa-car-side"></i>
                            Dados do Veículo
                        </div>

                        <div class="input-group-custom">
                            <div class="row g-3">
                                <div class="col-md-4">
                                    <label class="form-label">
                                        <i class="fas fa-trademark me-2"></i>Marca
                                    </label>
                                    <input type="text" name="marca" class="form-control" placeholder="Ex: Toyota">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">
                                        <i class="fas fa-car me-2"></i>Modelo
                                    </label>
                                    <input type="text" name="modelo" class="form-control" placeholder="Ex: Corolla">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">
                                        <i class="fas fa-id-card me-2"></i>Placa
                                    </label>
                                    <input type="text" name="placa" class="form-control" placeholder="ABC-1234" style="text-transform: uppercase;">
                                </div>
                            </div>

                            <div class="row g-3 mt-2">
                                <div class="col-md-12">
                                    <label class="form-label">
                                        <i class="fas fa-layer-group me-2"></i>Categoria do Veículo
                                    </label>
                                    <select name="categoria" class="form-select">
                                        <option value="hatch">🚗 Hatch (Compacto)</option>
                                        <option value="sedan">🚙 Sedan (Médio)</option>
                                        <option value="suv">🚐 SUV (Grande)</option>
                                        <option value="pickup">🚚 Pickup / Van</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="section-title">
                        <i class="fas fa-clipboard-list"></i>
                        Serviço e Detalhes
                    </div>

                    <div class="input-group-custom">
                        <div class="row g-3">
                            <div class="col-md-12">
                                <label class="form-label">
                                    <i class="fas fa-spray-can me-2"></i>Tipo de Serviço
                                </label>
                                <select name="servico_id" class="form-select" required>
                                    <option value="" disabled selected>Selecione o serviço...</option>
                                    {% for s in servicos %}
                                        <option value="{{ s.id }}">{{ s.nome }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>

                        <div class="row g-3 mt-2">
                            <div class="col-md-6">
                                <label class="form-label">
                                    <i class="fas fa-exclamation-triangle me-2"></i>Nível de Sujeira
                                </label>
                                <select name="tipo_sujeira" class="form-select">
                                    <option value="0">🟢 Leve (R$ 0,00)</option>
                                    <option value="20">🟡 Média (+ R$ 20,00)</option>
                                    <option value="50">🔴 Pesada (+ R$ 50,00)</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">
                                    <i class="fas fa-comment-dots me-2"></i>Observações
                                </label>
                                <input type="text" name="obs_entrada" class="form-control" placeholder="Ex: Risco na porta direita">
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-registrar">
                        <i class="fas fa-rocket"></i>
                        Iniciar Serviço Agora
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
function alternarCampos() {
    const modoExistente = document.getElementById('modo_existente').checked;
    const secaoExistente = document.getElementById('secao_existente');
    const secaoNovo = document.getElementById('secao_novo');

    if (modoExistente) {
        secaoExistente.style.display = 'block';
        secaoNovo.style.display = 'none';
        document.getElementsByName('nome')[0].required = false;
        document.getElementsByName('placa')[0].required = false;
        document.getElementsByName('veiculo_id')[0].required = true;
    } else {
        secaoExistente.style.display = 'none';
        secaoNovo.style.display = 'block';
        document.getElementsByName('nome')[0].required = true;
        document.getElementsByName('placa')[0].required = true;
        document.getElementsByName('veiculo_id')[0].required = false;
    }
}

window.onload = alternarCampos;
</script>

</body>
</html>
